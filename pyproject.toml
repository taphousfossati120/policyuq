[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policyuq-vlm"
version = "0.1.0"
description = "Policy-optimized vision-language reasoning with hierarchical uncertainty for prostate MRI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "attrs>=23.1",
    "fire>=0.5",
]

[project.optional-dependencies]
text = ["transformers>=4.30"]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0", "isort>=5.12", "mypy>=1.8", "pre-commit>=3.5"]

[project.scripts]
policyuq-vlm = "policyuq_vlm.summit:main"

[tool.setuptools.packages.find]
include = ["policyuq_vlm*"]

[tool.setuptools.package-data]
policyuq_vlm = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["policyuq_vlm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["policyuq_vlm"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disable_error_code = ["no-untyped-call"]
files = ["policyuq_vlm"]

[tool.pytest.ini_options]
testpaths = ["pitches"]
addopts = "-q"
